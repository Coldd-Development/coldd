<!doctype html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('coldd_theme');if(t==='light'||(t==='system'&&matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.setAttribute('data-theme','light');}catch(e){}try{if(localStorage.getItem('coldd_auth')==='in')document.documentElement.classList.add('auth-in');}catch(e){}</script>
  <script>try{var _gp=location.pathname.replace(/\/+$/,'')||'/';if(localStorage.getItem('coldd_site_mode')==='maintenance'&&!/^\/(signin|signup|forgot|reset|callback|roblox-callback|lock|admin)(\/|$)/.test(_gp)){var _gd=document.documentElement;_gd.style.visibility='hidden';window.__coldGateHold=setTimeout(function(){try{_gd.style.visibility=''}catch(e){}},10000);}}catch(e){}</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Connecting your Roblox account - coldd</title>
<link rel="icon" type="image/png" href="/logo.png" />
<meta name="theme-color" content="#15161b" />
<!-- Same treatment as /callback.html; the .cb-* rules live in styles.css so
     the two interstitials cannot drift apart. -->
<link rel="stylesheet" href="/styles.css?v=20261007m" />
</head>
<body>
  <div class="backdrop"></div>
  <div class="scrim"></div>
  <div class="cb-wrap">
    <div class="cb-card glass" id="cbCard" data-state="working">
      <img class="cb-logo" src="/logo.png" alt="coldd" />
      <div class="cb-spin" aria-hidden="true"></div>
      <div class="cb-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2h.01"/>
        </svg>
      </div>
      <p id="cbMsg" role="status">Finishing with Roblox…</p>
      <a class="cb-out lnk-back" id="cbOut" href="/signin">Back to sign in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/supabase-init.js?v=20261004b"></script>
  <script src="/site-gate.js?v=20260926a"></script>
  <script>
    (async function () {
      var msg = document.getElementById('cbMsg');
      var card = document.getElementById('cbCard');
      var out = document.getElementById('cbOut');

      function fail(text, target) {
        card.setAttribute('data-state', 'error');
        msg.textContent = text;
        // The card links wherever the redirect was heading, so a visitor whose
        // automatic redirect never fires is not stranded here.
        out.href = target || '/signin';
        out.textContent = (target && target.indexOf('/dashboard') === 0) ? 'Go to dashboard' : 'Back to sign in';
        setTimeout(function () { location.href = out.href; }, 2600);
      }
      try {
        if (!window.coldSupabase) throw new Error('Could not reach coldd. Please try again.');

        var params = new URLSearchParams(location.search);
        var error = params.get('error');
        if (error) throw new Error('Roblox denied the request.');

        var code = params.get('code');
        var state = params.get('state');
        if (!code) throw new Error('Roblox did not return an authorization code.');

        var expectedState = null;
        try { expectedState = sessionStorage.getItem('coldd_roblox_oauth_state'); } catch (e) {}
        try { sessionStorage.removeItem('coldd_roblox_oauth_state'); } catch (e) {}
        if (!expectedState || state !== expectedState) throw new Error('This link has expired. Please start again.');

        var redirectUri = location.origin + '/roblox-callback.html';

        // Where the page that started this wants us to land. Re-validated
        // here rather than trusted, since it becomes a redirect target.
        var returnTo = null;
        try {
          returnTo = sessionStorage.getItem('coldd_roblox_return');
          sessionStorage.removeItem('coldd_roblox_return');
        } catch (e) {}
        if (!returnTo || returnTo.charAt(0) !== '/' || returnTo.charAt(1) === '/') returnTo = null;

        // If we're already signed into coldd, this is linking an existing
        // account (started from the dashboard). Otherwise it's a primary
        // sign-in/sign-up (started from /signin or /signup).
        var sessionRes = await window.coldSupabase.auth.getSession();
        var session = sessionRes && sessionRes.data ? sessionRes.data.session : null;

        if (session) {
          try {
            var linkData = await window.coldAuth.invokeFn('roblox-oauth-callback', { code: code, redirectUri: redirectUri });
            msg.textContent = 'Linked as ' + linkData.robloxUsername + '. Redirecting…';
            var dest = returnTo || '/dashboard?panel=account';
            setTimeout(function () { location.href = dest; }, 700);
          } catch (linkErr) {
            // Already signed in, so the useful exit is the dashboard, not
            // the sign-in page they do not need.
            fail((linkErr && linkErr.message) || 'Could not link that Roblox account.', returnTo || '/dashboard?panel=account');
          }
          return;
        }

        var signinData = await window.coldAuth.invokeFn('roblox-signin', { code: code, redirectUri: redirectUri });

        var verifyRes = await window.coldSupabase.auth.verifyOtp({
          email: signinData.email, token: signinData.otp, type: 'email'
        });
        if (verifyRes.error || !verifyRes.data || !verifyRes.data.session) {
          throw new Error('Could not sign you in. Please try again.');
        }

        window.coldAuth.saveProfile({
          id: verifyRes.data.user.id, provider: 'roblox', name: signinData.robloxUsername,
          email: '', avatar: signinData.avatarUrl || ''
        });
        try { localStorage.setItem('coldd_auth', 'in'); } catch (e) {}

        msg.textContent = 'Signed in as ' + signinData.robloxUsername + '. Redirecting…';
        var signedInDest = returnTo || '/dashboard';
        setTimeout(function () { location.href = signedInDest; }, 700);
      } catch (err) {
        console.error('[coldd] roblox callback error:', err);
        fail((err && err.message) || 'Could not continue with Roblox.');
      }
    })();
  </script>
</body>
</html>
