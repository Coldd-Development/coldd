<!doctype html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('coldd_theme');if(t==='light'||(t==='system'&&matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.setAttribute('data-theme','light');}catch(e){}try{if(localStorage.getItem('coldd_auth')==='in')document.documentElement.classList.add('auth-in');}catch(e){}</script>
  <script>try{var _gp=location.pathname.replace(/\/+$/,'')||'/';if(localStorage.getItem('coldd_site_mode')==='maintenance'&&!/^\/(signin|signup|forgot|reset|callback|roblox-callback|lock|admin)(\/|$)/.test(_gp)){var _gd=document.documentElement;_gd.style.visibility='hidden';window.__coldGateHold=setTimeout(function(){try{_gd.style.visibility=''}catch(e){}},10000);}}catch(e){}</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Connecting YouTube - coldd</title>
<!-- Admin-only utility page, same hand-rolled OAuth-code exchange pattern
     as /tiktok-callback.html - the YouTube Analytics API is OAuth-only and
     isn't a Supabase Auth provider, so this trades ?code via
     youtube-oauth-exchange rather than coldSupabase.auth. -->
<link rel="icon" type="image/png" href="/logo.png" />
<meta name="theme-color" content="#15161b" />
<link rel="stylesheet" href="/styles.css?v=20261009x140340" />
</head>
<body>
  <div class="backdrop"></div>
  <div class="scrim"></div>
  <div class="cb-wrap">
    <div class="cb-card glass" id="cbCard" data-state="working" style="max-width:460px;">
      <img class="cb-logo" src="/logo.png" alt="coldd" />
      <div class="cb-spin" aria-hidden="true"></div>
      <div class="cb-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2h.01"/>
        </svg>
      </div>
      <div class="cb-icon-ok" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </div>
      <p id="cbMsg" role="status">Connecting to YouTube…</p>
      <a class="cb-out lnk-back" href="/admin">Back to admin</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.min.js" integrity="sha384-B2duOBIryCXbX4eDE4BdJwtNkQMRQde3o6IsjfPW28E6aH1CYE96hHeZRG3zY56O" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/supabase-init.js?v=20261009x063147"></script>
  <script src="/site-gate.js?v=20261008c"></script>
  <script>
    (async function () {
      var msg = document.getElementById('cbMsg');
      var card = document.getElementById('cbCard');
      function fail(text) { card.setAttribute('data-state', 'error'); msg.textContent = text; }
      try {
        if (!window.coldSupabase || !window.coldAuth) throw new Error('Could not reach coldd. Please try again.');
        var params = new URLSearchParams(location.search);
        var error = params.get('error');
        if (error) throw new Error('Google denied the request: ' + (params.get('error_description') || error));
        var code = params.get('code');
        if (!code) throw new Error('No authorization code in the URL.');

        var who = await window.coldAuth.checkIsAdmin();
        if (!who.isAdmin) throw new Error('Admin access required to connect YouTube.');

        var redirectUri = location.origin + location.pathname;
        var res = await window.coldSupabase.functions.invoke('youtube-oauth-exchange', { body: { code: code, redirectUri: redirectUri } });
        var data = res && res.data;
        if (res.error || !data || !data.ok) {
          var serverMsg = null;
          if (res.error && res.error.context && typeof res.error.context.json === 'function') {
            var parsed = await res.error.context.json().catch(function () { return null; });
            serverMsg = parsed && parsed.error;
          }
          throw new Error(serverMsg || (data && data.error) || 'YouTube token exchange failed.');
        }
        card.setAttribute('data-state', 'ok');
        msg.textContent = 'Connected. Watch-time and traffic-source stats will appear in Marketing shortly (functions redeploy over the next minute).';
      } catch (err) {
        console.error('[coldd] youtube callback error:', err);
        fail(err.message || 'Could not connect YouTube.');
      }
    })();
  </script>
</body>
</html>
