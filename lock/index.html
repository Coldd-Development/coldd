<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('coldd_theme');if(t==='light'||(t==='system'&&matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.setAttribute('data-theme','light');}catch(e){}try{if(localStorage.getItem('coldd_auth')==='in')document.documentElement.classList.add('auth-in');}catch(e){}</script>
  <script>try{var _gp=location.pathname.replace(/\/+$/,'')||'/';if(localStorage.getItem('coldd_site_mode')==='maintenance'&&!/^\/(signin|signup|forgot|reset|callback|roblox-callback|lock|admin)(\/|$)/.test(_gp)){var _gd=document.documentElement;_gd.style.visibility='hidden';window.__coldGateHold=setTimeout(function(){try{_gd.style.visibility=''}catch(e){}},10000);}}catch(e){}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Under Maintenance - coldd Development</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <!-- meta:start -->
  <meta name="description" content="coldd.dev is temporarily unavailable while we make changes." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#15161b" />
  <!-- meta:end -->


  <!-- This page previously loaded NO stylesheet at all, so the gate - the very
       first thing anyone sees while the site is private - rendered as browser
       defaults: Times New Roman on white, with unstyled form controls. It now
       shares the site's own tokens and type. -->
  <link rel="stylesheet" href="/styles.css?v=20261009x062301" />
</head>
<body class="lock-page">
  <div class="backdrop"></div>
  <div class="scrim"></div>

  <main class="lock-wrap">
    <div class="lock-card glass">
      <img class="lock-logo" src="/logo.png" alt="coldd" />

      <h1 class="lock-h1">We're under maintenance</h1>
      <p class="lock-sub">coldd is down for maintenance right now. If you've been given a staff password, enter it below to get in.</p>

      <form id="lockForm" class="lock-form" novalidate>
        <label class="lock-field">
          <span class="lock-label">Access password</span>
          <input type="password" id="lockPw" autocomplete="current-password" placeholder="Enter password" aria-describedby="lockErr" />
        </label>
        <button class="btn btn-primary lock-go" type="submit">
          <span class="lock-go-label">Unlock</span>
        </button>
      </form>

      <p class="lock-err" id="lockErr" role="alert" hidden>That password isn't right. Check it and try again.</p>

      <p class="lock-foot">Not expecting this? <a href="https://discord.gg/coldd" target="_blank" rel="noopener">Find us on Discord</a>.</p>
    </div>
  </main>

  <style>
    /* Scoped to the gate. It ships no shared chrome, so these few rules live
       here rather than adding weight to every other page's stylesheet - same
       reasoning as 404.html. */
    .lock-wrap { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .lock-card { width: 100%; max-width: 440px; padding: 40px 36px 32px; border-radius: var(--r);
      display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
    .lock-logo { height: 34px; width: auto; display: block; margin-bottom: 26px; }
    .lock-h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.028em; line-height: 1.15; margin: 0; color: var(--fg); text-wrap: balance; }
    .lock-sub { font-size: 14.5px; line-height: 1.55; color: var(--fg-2); margin: 10px 0 0; max-width: 46ch; }

    .lock-form { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 26px; }
    .lock-field { display: flex; flex-direction: column; gap: 7px; width: 100%; }
    .lock-label { font-size: var(--t-label); font-weight: 600; color: var(--fg-2); }
    /* 16px minimum so iOS Safari does not zoom the viewport on focus - the
       same floor the rest of the site's inputs hold to. */
    .lock-field input { width: 100%; font-family: inherit; font-size: 16px; color: var(--fg);
      background: rgba(255,255,255,0.04); border: 1px solid var(--hairline); border-radius: var(--r-ctl);
      padding: 12px 14px; min-height: 46px;
      transition: border-color .18s var(--ease), background .18s var(--ease); }
    .lock-field input::placeholder { color: var(--fg-3); }
    .lock-field input:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,0.06); }
    .lock-go { width: 100%; justify-content: center; margin-top: 2px; }

    .lock-err { width: 100%; margin: 14px 0 0; font-size: 13.5px; line-height: 1.5;
      color: var(--warn); background: var(--warn-tint); border: 1px solid var(--warn-line);
      border-radius: var(--r-ctl); padding: 10px 13px; }
    .lock-err[hidden] { display: none; }

    .lock-foot { font-size: 13px; color: var(--fg-3); margin: 22px 0 0; }
    .lock-foot a { color: var(--fg-2); text-decoration: underline; text-underline-offset: 2px; }
    .lock-foot a:hover { color: var(--fg); }

    @media (max-width: 460px) {
      .lock-card { padding: 32px 24px 26px; }
      .lock-h1 { font-size: 23px; }
    }
  </style>

<script>
  // Password is checked server-side via a Supabase Edge Function - it is
  // never present in this file, so it can't be read via view-source or
  // devtools like the old version could.
  var SUPABASE_URL = 'https://ekinmytmudjwfaqaqswp.supabase.co';
  var ANON_KEY = 'sb_publishable_q5JwjFnMT_0Uhu5rAlAkQA_DEGnhwV7';

  document.getElementById('lockForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var v = document.getElementById('lockPw').value;
    var btn = e.target.querySelector('button');
    var label = btn.querySelector('.lock-go-label');
    var err = document.getElementById('lockErr');
    err.hidden = true;
    btn.disabled = true;
    if (label) label.textContent = 'Checking…';
    try {
      var res = await fetch(SUPABASE_URL + '/functions/v1/lock-check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
        body: JSON.stringify({ password: v })
      });
      var data = await res.json();
      btn.disabled = false;
      if (label) label.textContent = 'Unlock';
      if (data && data.ok) {
        try { sessionStorage.setItem('coldd_unlocked', '1'); } catch (err2) {}
        var params = new URLSearchParams(location.search);
        var dest = params.get('r');
        // Re-validated here rather than trusted, since it becomes a redirect
        // target - same rule roblox-callback.html applies to returnTo: must
        // be an on-site path, never an absolute/protocol-relative URL an
        // attacker could plant in a shared unlock link (?r=https://evil...).
        var safeDest = '/';
        if (dest) {
          try {
            var decoded = decodeURIComponent(dest);
            if (decoded.charAt(0) === '/' && decoded.charAt(1) !== '/') safeDest = decoded;
          } catch (e2) {}
        }
        location.replace(safeDest);
      } else {
        err.hidden = false;
        document.getElementById('lockPw').select();
      }
    } catch (err3) {
      btn.disabled = false;
      if (label) label.textContent = 'Unlock';
      err.textContent = "Couldn't reach the server. Check your connection and try again.";
      err.hidden = false;
    }
  });
</script>
</body>
</html>
